name: Modelo educativo
on: [push, pull_request]
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  qiskit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-qiskit.txt
      - run: python -m unittest discover -s tests_qiskit -v
  ibm-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ibm.txt
      - run: python -m unittest discover -s tests_ibm -v
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - run: python -m hardware.tools.check_core
      - run: yosys -p 'read_verilog -sv hardware/rtl/q14_hadamard.sv hardware/rtl/pequibit_core.sv; synth -top pequibit_core; check -assert; stat'
